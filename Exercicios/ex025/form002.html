<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Meu Segundo Formulário</h1>
    <form action="cadastro.php" method="POST" autocomplete="on">
        <p> 
           <label for="iusu">Usuario</label>:
           <input type="text" name="usu" id="iusu" required minlength="5" maxlength="10" placeholder="Nome de usuário" autocomplete="username">
        </p>  
        <p>
           <label for="isen">Senha</label>:
           <input type="password" name="sen" id="isen" required minlength="8" maxlength="10" placeholder="Mínimo 8 caracteres" autocomplete="current-password">
        </p> 
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
